<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f1733" />
    <meta name="description" content="Equinox — un jeu d'énigmes d'ombre et de lumière." />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="stylesheet" href="./src/style.css" />
    <title>Equinox</title>
  </head>
  <body>
    <div id="stage">
      <!-- Le jeu est dessiné ici -->
      <canvas id="game"></canvas>
      <!-- Pendant le film d'une histoire : un voile pour qu'aucun toucher ne passe,
           un petit encart de texte posé sur l'image, et la barre d'avancement en bas -->
      <div id="film-veil" class="hidden">
        <p id="film-text"></p>
        <div id="film-bar"><i id="film-progress"></i></div>
      </div>

      <!-- Pendant la partie : nom du niveau, médailles, bouton pause, indice -->
      <div id="hud" class="hidden">
        <div id="level-name"></div>
        <!-- Les trois médailles du niveau (un toucher ouvre le volet de pause) -->
        <button id="level-medals" class="pips" aria-label="Voir les objectifs du niveau"></button>
        <button id="open-menu" aria-label="Pause">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h3.4v14H7zM13.6 5H17v14h-3.4z" fill="currentColor" /></svg>
        </button>
        <!-- Annonce d'une médaille gagnée -->
        <div id="toast">
          <span id="toast-pip" class="pip"></span>
          <span><b id="toast-medal"></b><span id="toast-text"></span></span>
        </div>
        <div id="hint"></div>
      </div>

      <!-- L'accueil : le titre, et la prochaine chose à faire en un seul grand bouton -->
      <div id="title" class="overlay">
        <div class="sigil"></div>
        <h1>EQUINOX</h1>
        <div id="home">
          <div id="home-chapter" class="eyebrow"></div>
          <h2 id="home-title"></h2>
          <div id="home-line" class="home-line"></div>
          <button id="start" class="primary"></button>
          <div class="row">
            <button id="home-voyage" class="ghost">Le voyage</button>
            <button id="home-settings" class="ghost">Réglages</button>
          </div>
        </div>
      </div>

      <!-- Le voyage : les chapitres en haut, puis l'histoire et les dix niveaux de chacun -->
      <div id="voyage" class="overlay menu hidden">
        <div class="eyebrow">Le voyage</div>
        <div id="chapter-tabs" class="tabs"></div>
        <h2 id="voyage-title"></h2>
        <div id="voyage-sub" class="place"></div>
        <!-- Une page par chapitre (son histoire, puis ses dix niveaux) : on passe
             de l'une à l'autre en glissant le doigt. Remplies par ui.js. -->
        <div id="voyage-pages" class="pages"></div>
        <div class="actions">
          <button id="close-voyage" class="ghost">Retour</button>
        </div>
      </div>

      <!-- La pause : un volet qui monte du bas (objectifs du niveau, puis cinq actions) -->
      <div id="pause" class="overlay sheet hidden">
        <div class="card">
          <div class="grip"></div>
          <div id="pause-level" class="eyebrow"></div>
          <div id="goal-list" class="goals"></div>
          <p id="goal-note" class="note"></p>
          <div class="rounds">
            <button id="resume" class="round main">
              <i><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5 L19 12 L8 19z" fill="currentColor" /></svg></i>
              <span>Reprendre</span>
            </button>
            <button id="pause-restart" class="round">
              <i><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12a7 7 0 1 1-2.2-5.1" /><path d="M19 4v4h-4" /></svg></i>
              <span>Recommencer</span>
            </button>
            <button id="pause-levels" class="round">
              <i><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 19 L9 8 L13 14 L16 10 L21 19z" /></svg></i>
              <span>Voyage</span>
            </button>
            <button id="pause-sound" class="round">
              <i><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10v4h3l5 4V6L7 10z" /><path class="waves" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11" /><path class="mute" d="M16 9.5l5 5M21 9.5l-5 5" /></svg></i>
              <span id="pause-sound-label">Son</span>
            </button>
            <button id="pause-settings" class="round">
              <i><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3.2" /><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1" /></svg></i>
              <span>Réglages</span>
            </button>
          </div>
        </div>
      </div>

      <!-- La fin d'un niveau : le souvenir retrouvé, et le niveau suivant déjà prêt -->
      <div id="memory" class="overlay sheet hidden">
        <div class="card">
          <div class="grip"></div>
          <div id="memory-number" class="eyebrow"></div>
          <h2 id="memory-title"></h2>
          <p id="memory-text"></p>
          <p id="memory-tech" class="tech"></p>
          <div id="memory-medals" class="medal-line"></div>
          <button id="next" class="next">
            <span id="next-thumb" class="thumb"></span>
            <span class="next-text"><small>Ensuite</small><b id="next-title"></b></span>
            <span class="disc gold"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5 L19 12 L8 19z" fill="currentColor" /></svg></span>
          </button>
          <p id="memory-end" class="end" hidden>La suite du voyage arrive bientôt.</p>
          <div class="links">
            <button id="contemplate">Contempler</button>
            <button id="replay">Rejouer</button>
            <button id="memory-voyage">Le voyage</button>
          </div>
        </div>
      </div>

      <!-- Les réglages -->
      <div id="settings" class="overlay menu hidden">
        <div class="card">
          <div class="eyebrow">Réglages</div>
          <div class="settings">
            <label class="setting">
              <span>Son</span>
              <input id="set-sound" type="checkbox" class="switch" />
            </label>
            <label class="setting">
              <span>Volume</span>
              <input id="set-volume" type="range" min="0" max="100" step="5" />
            </label>
            <label class="setting">
              <span>Indices<small>les phrases d'aide en bas de l'écran</small></span>
              <input id="set-hints" type="checkbox" class="switch" />
            </label>
            <label class="setting">
              <span>Annonce des médailles<small>un message quand un objectif est atteint</small></span>
              <input id="set-toasts" type="checkbox" class="switch" />
            </label>
            <div class="setting">
              <span>Progression<small id="reset-note">histoires vues, niveaux terminés et médailles</small></span>
              <button id="reset" class="danger">Effacer</button>
            </div>
          </div>
          <p id="version" class="note"></p>
          <div class="actions">
            <button id="close-settings" class="ghost">Retour</button>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
